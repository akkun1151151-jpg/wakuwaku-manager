function normalizeKana(v){
 return String(v||"").replace(/[ァ-ヶ]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0x60);});
}
function normalizeSearch(v){
 return normalizeKana(v).toLowerCase();
}
function normalize(){
 state.chars.forEach(function(c){
  if(typeof c.kana!=="string")c.kana="";
  if(typeof c.image!=="string")c.image="";
  if(typeof c.race!=="string")c.race="";
  if(typeof c.battleType!=="string")c.battleType="バランス";
  if(typeof c.shotType!=="string")c.shotType="反射";
  if(!Array.isArray(c.owned))c.owned=state.accounts.map(function(){return true;});
  if(!Array.isArray(c.waku))c.waku=state.accounts.map(function(){return [];});
  if(!Array.isArray(c.hasSecond))c.hasSecond=state.accounts.map(function(){return false;});
  if(!Array.isArray(c.waku2))c.waku2=state.accounts.map(function(){return [];});
  while(c.owned.length<state.accounts.length)c.owned.push(true);
  while(c.waku.length<state.accounts.length)c.waku.push([]);
  while(c.hasSecond.length<state.accounts.length)c.hasSecond.push(false);
  while(c.waku2.length<state.accounts.length)c.waku2.push([]);
  c.owned=c.owned.slice(0,state.accounts.length);
  c.waku=c.waku.slice(0,state.accounts.length);
  c.hasSecond=c.hasSecond.slice(0,state.accounts.length);
  c.waku2=c.waku2.slice(0,state.accounts.length);
 });
}
function normalizeState(){
  if(!state.accounts||!Array.isArray(state.accounts))state.accounts=["メイン","サブ1","サブ2","サブ3","サブ4"];
  if(!Array.isArray(state.chars))state.chars=[];
  if(!Array.isArray(state.party))state.party=[];
  if(!Array.isArray(state.savedParties))state.savedParties=[];
  if(!Array.isArray(state.partyGroups))state.partyGroups=[];
  if(!Array.isArray(state.guardians))state.guardians=[];
  if(typeof state.guardianId!=="string")state.guardianId="";
  state.chars.forEach(function(c){if(!Array.isArray(c.owned))c.owned=state.accounts.map(function(){return true;});if(!Array.isArray(c.waku))c.waku=state.accounts.map(function(){return [];});if(!Array.isArray(c.hasSecond))c.hasSecond=state.accounts.map(function(){return false;});if(!Array.isArray(c.waku2))c.waku2=state.accounts.map(function(){return [];});while(c.owned.length<state.accounts.length)c.owned.push(true);while(c.waku.length<state.accounts.length)c.waku.push([]);while(c.hasSecond.length<state.accounts.length)c.hasSecond.push(false);while(c.waku2.length<state.accounts.length)c.waku2.push([]);c.owned=c.owned.slice(0,state.accounts.length);c.waku=c.waku.slice(0,state.accounts.length);c.hasSecond=c.hasSecond.slice(0,state.accounts.length);c.waku2=c.waku2.slice(0,state.accounts.length);});
}
function load(){
 try{
  var raw=localStorage.getItem("wakuwaku_v023");
  if(raw){var x=JSON.parse(raw);if(x&&Array.isArray(x.accounts)&&Array.isArray(x.chars))state=x;}
  if(!Array.isArray(state.party))state.party=[];
  if(!Array.isArray(state.savedParties))state.savedParties=[];
  if(!Array.isArray(state.partyGroups))state.partyGroups=[];
  if(!Array.isArray(state.guardians))state.guardians=[];
  if(typeof state.guardianId!=="string")state.guardianId="";
  state.savedParties=state.savedParties.filter(function(p){return p&&Array.isArray(p.slots);}).map(function(p){return {id:String(p.id||Date.now()+Math.random()),name:String(p.name||"無題の編成"),groupId:String(p.groupId||""),guardianId:String(p.guardianId||""),slots:p.slots.slice(0,4).map(function(x){return {id:x&&x.id?String(x.id):"",accountIndex:Math.max(0,Math.min(state.accounts.length-1,parseInt(x&&x.accountIndex,10)||0))};})};});
  while(state.party.length<4)state.party.push({id:"",accountIndex:0});
  state.party=state.party.slice(0,4).map(function(x){
    if(typeof x === "string") return {id:x,accountIndex:0};
    return {id:x&&x.id?String(x.id):"",accountIndex:Math.max(0,Math.min(state.accounts.length-1,parseInt(x&&x.accountIndex,10)||0))};
  });
 }catch(e){}
 normalize();
}

function startCloudSync(){
 Promise.all([
  supa.from('wakuwaku_data').select('data').eq('user_id',cloudUser.id).maybeSingle(),
  supa.from('wakuwaku_shared_characters').select('name,image')
 ]).then(function(results){
  var r=results[0], sr=results[1];
  if(sr.error){console.error(sr.error);sharedChars=[];}else{sharedChars=sr.data||[];}
  if(r.error){console.error(r.error);alert('クラウドデータの取得に失敗しました。Supabaseのテーブル/RLS設定を確認してください。');return;}
  if(r.data&&r.data.data){syncing=true;state=r.data.data;syncing=false;normalizeState();applySharedImages();cloudReady=true;renderChars();}
  else {cloudReady=true;applySharedImages();if(hasLocalData()&&confirm('この端末に保存されている既存データをクラウドへ移行しますか？'))cloudSaveNow();renderChars();}
 });
}

function formatCharName(name){return esc(String(name||"")).replace(/\s+/g,"<br>");}
function exportData(){
 try{
  var backup={
   backupVersion:1,
   appVersion:"v1.2.4",
   exportedAt:new Date().toISOString(),
   data:JSON.parse(JSON.stringify(state))
  };
  var json=JSON.stringify(backup,null,2);
  var blob=new Blob([json],{type:"application/json;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  var d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
  a.download="wakuwaku_backup_"+stamp+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
 }catch(e){console.error(e);alert("バックアップの書き出しに失敗しました。ブラウザのダウンロード設定を確認してください。");}
}
function importData(event){
 var file=event&&event.target&&event.target.files&&event.target.files[0];
 if(!file)return;
 var reader=new FileReader();
 reader.onload=function(){
  try{
   var parsed=JSON.parse(reader.result);
   var incoming=parsed&&parsed.data&&typeof parsed.data==="object"?parsed.data:parsed;
   if(!incoming||!Array.isArray(incoming.accounts)||!Array.isArray(incoming.chars))throw new Error("invalid backup");
   if(!confirm("バックアップのデータで現在のデータを置き換えます。よろしいですか？"))return;
   state=incoming;
   normalizeState();normalize();
   save();
   loadSharedCharacters().then(function(){renderSettings();});
   alert("バックアップを読み込みました。クラウドにも保存しました。");
  }catch(e){console.error(e);alert("バックアップファイルを読み込めませんでした。正しいJSONバックアップを選択してください。");}
  event.target.value="";
 };
 reader.readAsText(file,"utf-8");
}
